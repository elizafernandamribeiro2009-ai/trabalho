<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8 - Somatório de Números</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 shadow-sm">
            <h1 class="mb-4">Somatório de Números</h1>

            <!-- Form para o utilizador introduzir o limite -->
            <div class="row g-3 align-items-center mb-3">
                <div class="col-auto">
                    <label for="limite" class="col-form-label fw-bold">Digite o Limite (N):</label>
                </div>
                <div class="col-auto">
                    <input type="number" id="limite" class="form-control" placeholder="Ex: 12">
                </div>
                <div class="col-auto">
                    <button type="button" onclick="calcularSoma()" class="btn btn-primary">Calcular</button>
                </div>
            </div>

            <!-- Div para apresentar o resultado -->
            <div id="resultado"></div>

            <!-- Botão de retorno ao index -->
            <div class="mt-4 border-top pt-3">
                <a href="index.html" class="btn btn-outline-secondary">Voltar para a Central</a>
            </div>
        </div>
    </div>

    <script src="script8.js"></script>
</body>
</html>
