<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4 - Classificação por Idade</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4">Classificação por Idade</h1>

            <form class="row g-3 align-items-end">
                <!-- Campo Nome -->
                <div class="col-md-5">
                    <label for="nome" class="form-label fw-bold">Nome</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite o nome">
                </div>

                <!-- Campo Idade -->
                <div class="col-md-4">
                    <label for="idade" class="form-label fw-bold">Idade</label>
                    <input type="number" min="0" max="120" class="form-control" id="idade" placeholder="Digite a idade">
                </div>

                <!-- Botão Classificar -->
                <div class="col-md-3">
                    <button type="button" onclick="classificarIdade()" class="btn btn-primary w-100">
                        Classificar
                    </button>
                </div>
            </form>

            <!-- Área de resultado -->
            <div id="resultado" class="mt-4"></div>

            <!-- Botão para voltar à página inicial -->
            <div class="mt-4 border-top pt-3">
                <a href="index.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Voltar para a Central
                </a>
            </div>
        </div>
    </div>

    <!-- Script JS do exercício -->
    <script src="script4.js"></script>

</body>

</html>
