<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7 - Contagem Regressiva</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4">Contagem Regressiva</h1>

            <form class="row gy-2 gx-3 align-items-center">
                <div class="col-auto">
                    <label class="visually-hidden" for="numero">Número Inicial</label>
                    <input 
                        type="number" 
                        min="1"
                        class="form-control" 
                        id="numero" 
                        placeholder="Digite o número inicial">
                </div>

                <div class="col-auto">
                    <button 
                        type="button" 
                        class="btn btn-primary"
                        onclick="contagemRegressiva()">
                        Iniciar Contagem
                    </button>
                </div>
            </form>

            <!-- Área de resultado -->
            <div id="resultado" class="mt-4"></div>

            <!-- Botão para voltar à página inicial -->
            <div class="mt-4 border-top pt-3">
                <a href="index.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Voltar para a Central
                </a>
            </div>
        </div>
    </div>

    <!-- Script JS do exercício -->
    <script src="script7.js"></script>

</body>

</html>
