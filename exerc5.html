<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Menu de Setores</h1>

        <form class="row gy-2 gx-3 align-items-center">

            <div class="col-auto">
                <label class="visually-hidden" for="opcao">Escolha um setor</label>

                <select class="form-select" id="opcao">

                    <option selected disabled>Escolha um setor</option>

                    <option value="1">Administração</option>
                    <option value="2">Automação</option>
                    <option value="3">Mineração</option>
                    <option value="4">Metalurgia</option>
                    <option value="5">Edificações</option>

                </select>
            </div>

            <div class="col-auto">
                <button 
                    type="button" 
                    class="btn btn-primary"
                    onclick="mostrarSetor()">
                    Escolher
                </button>
            </div>

        </form>

        <div id="resultado" class="mt-4"></div>

    </div>

    <script src="script5.js"></script>

</body>

</html>
