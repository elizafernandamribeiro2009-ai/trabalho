<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Mini Sistema de Pedidos</h1>

        <div id="produtos"></div>

        <hr>

        <h3>Fazer Pedido</h3>

        <form class="row gy-2 gx-3 align-items-center">

            <div class="col-auto">
                <label class="visually-hidden" for="opcao">
                    Produto
                </label>

                <select class="form-select" id="opcao">

                    <option selected disabled>
                        Escolha um produto
                    </option>

                    <option value="1">Sensor</option>
                    <option value="2">Arduino</option>
                    <option value="3">LED</option>
                    <option value="4">Servo Motor</option>
                    <option value="5">Protoboard</option>

                </select>
            </div>

            <div class="col-auto">
                <label class="visually-hidden" for="quantidade">
                    Quantidade
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="quantidade"
                    placeholder="Quantidade"
                    min="1">
            </div>

            <div class="col-auto">
                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="fazerPedido()">

                    Comprar

                </button>
            </div>

        </form>

        <div id="resultado" class="mt-4"></div>

    </div>

    <script src="script10.js"></script>

</body>

</html>
