<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - Média do Aluno</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4">Calculadora de Média do Aluno</h1>

            <form class="row g-3 align-items-center">
                <!-- Nome do Aluno -->
                <div class="col-md-3">
                    <label for="nome" class="form-label fw-bold">Nome do Aluno</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite o nome">
                </div>

                <!-- Nota 1 -->
                <div class="col-md-2">
                    <label for="nota1" class="form-label fw-bold">Nota 1</label>
                    <input type="number" step="0.1" min="0" max="10" class="form-control" id="nota1" placeholder="0 a 10">
                </div>

                <!-- Nota 2 -->
                <div class="col-md-2">
                    <label for="nota2" class="form-label fw-bold">Nota 2</label>
                    <input type="number" step="0.1" min="0" max="10" class="form-control" id="nota2" placeholder="0 a 10">
                </div>

                <!-- Nota 3 -->
                <div class="col-md-2">
                    <label for="nota3" class="form-label fw-bold">Nota 3</label>
                    <input type="number" step="0.1" min="0" max="10" class="form-control" id="nota3" placeholder="0 a 10">
                </div>

                <!-- Botão Calcular -->
                <div class="col-md-3 d-flex align-items-end pt-4">
                    <button type="button" onclick="calcularMedia()" class="btn btn-primary w-100">
                        Calcular Média
                    </button>
                </div>
            </form>

            <!-- Área de resultado -->
            <div id="resultado" class="mt-4"></div>

            <!-- Botão para voltar à página inicial -->
            <div class="mt-4 border-top pt-3">
                <a href="index.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Voltar para a Central
                </a>
            </div>
        </div>
    </div>

    <!-- Script JS do exercício -->
    <script src="script2.js"></script>

</body>

</html>
