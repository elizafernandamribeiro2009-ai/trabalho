<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dados</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

  <h2 class="mb-4">Cadastro</h2>

  <div class="row mb-3">
    <label for="nome" class="col-sm-2 col-form-label">Nome</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="nome">
    </div>
  </div>

  <div class="row mb-3">
    <label for="idade" class="col-sm-2 col-form-label">Idade</label>
    <div class="col-sm-10">
      <input type="number" class="form-control" id="idade">
    </div>
  </div>

  <div class="row mb-3">
    <label for="cidade" class="col-sm-2 col-form-label">Cidade</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="cidade">
    </div>
  </div>

  <div class="row mb-3">
    <label for="curso" class="col-sm-2 col-form-label">Curso</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="curso">
    </div>
  </div>

  <div class="row mb-3">
    <label for="tecnologia" class="col-sm-2 col-form-label">Tecnologia</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="tecnologia">
    </div>
  </div>

  <button onclick="mostrarDados()" class="btn btn-primary">
    Mostrar dados
  </button>

  <div id="resultado" class="mt-4"></div>
  <script src="script1.js"></script>
</div>

</body>
</html>
